name: Build Windows installer

# Manually triggerable from the Actions tab, and automatic on pushes to main.
# Produces the offline NSIS installer (.exe) as a downloadable workflow artifact
# — no GitHub Release is created, so no extra repo permissions are needed.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the Windows app (offline NSIS installer)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: turf-ledger-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
