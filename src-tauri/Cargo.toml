[package]
name = "turf-app"
version = "0.1.0"
description = "Turf booking app"
authors = ["you"]
edition = "2021"

[lib]
name = "turf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-android-save = { path = "plugins/android-save" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows Credential Manager backing for the GitHub backup PAT (see
# keyring_get_token/keyring_set_token/keyring_delete_token in lib.rs).
# Scoped to Windows only — this project's bundle targets (tauri.conf.json)
# are nsis/msi only, and Android/iOS go through github.ts's localStorage
# fallback instead (there's no equivalent one-line OS keystore there).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
incremental = false
opt-level = "s"
