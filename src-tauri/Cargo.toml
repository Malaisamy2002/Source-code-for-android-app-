[package]
name = "turf-ledger"
version = "0.1.0"
description = "Turf Bookings & Sales Ledger desktop app"
edition = "2021"
rust-version = "1.77.2"

# See https://tauri.app/v1/guides/getting-started/setup/ for more info
[lib]
name = "turf_ledger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The Android CI workflow builds `--debug` (no release keystore configured
# yet — see build-android.yml), which uses this `dev` profile, not the one
# above. Without an override here, `dev` keeps full DWARF debug symbols in
# the compiled .so — that's what was making even a single-ABI debug APK
# 100-200MB. `strip = "debuginfo"` drops those symbols while leaving the
# build otherwise unoptimized and still debuggable at the Android/JS layer
# (this only affects native Rust backtraces, which the app doesn't rely on
# for debugging — most issues surface in the webview/JS side anyway).
[profile.dev]
strip = "debuginfo"
